<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Kuis IPA: Perubahan Fisika dan Kimia</title>
<style>
:root{--bg:#eaf6ff;--card:#fff;--tx:#1d2b3a;--mut:#5b6b7b;--pri:#2f80ed;--pri2:#1c63c4;--ok:#1fa35c;--okbg:#dff6e8;--no:#e5484d;--nobg:#fde4e4;--line:#d5e3f1;--easy:#1fa35c;--mid:#f59f00;--hard:#e5484d;--soft:#fff7d6;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#101c2b;--card:#1a2a3d;--tx:#eef4fb;--mut:#a7b8c9;--line:#2f4560;--okbg:#14382a;--nobg:#401c20;--soft:#3a3320;--pri:#5a9cf5}}
:root[data-theme="dark"]{--bg:#101c2b;--card:#1a2a3d;--tx:#eef4fb;--mut:#a7b8c9;--line:#2f4560;--okbg:#14382a;--nobg:#401c20;--soft:#3a3320;--pri:#5a9cf5}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--tx);font-family:"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;font-size:20px;line-height:1.5}
.app{max-width:520px;margin:0 auto;padding:16px 16px 40px}
.card{background:var(--card);border:2px solid var(--line);border-radius:24px;padding:22px 18px;box-shadow:0 6px 0 var(--line)}
.center{text-align:center}
.big{font-size:72px;line-height:1.1;margin:4px 0}
h1{font-size:30px;line-height:1.2;margin:8px 0}
h2{font-size:24px;margin:0 0 8px}
.sub{color:var(--mut);font-size:18px;margin:4px 0}
.info{background:var(--soft);border-radius:16px;padding:12px 14px;margin:16px 0;font-size:18px;text-align:left}
.info b{display:block}
.chips{display:flex;gap:8px;justify-content:center;flex-wrap:wrap;margin:12px 0}
.chip{border-radius:999px;padding:4px 14px;font-size:16px;font-weight:700;color:#fff}
input{width:100%;font-size:20px;padding:14px;border-radius:14px;border:2px solid var(--line);background:var(--bg);color:var(--tx);margin:8px 0 12px}
button{font:inherit;cursor:pointer}
.btn{width:100%;min-height:58px;border:0;border-radius:18px;background:var(--pri);color:#fff;font-size:22px;font-weight:700;box-shadow:0 5px 0 var(--pri2);margin-top:10px}
.btn:active{transform:translateY(3px);box-shadow:0 2px 0 var(--pri2)}
.btn.alt{background:var(--card);color:var(--pri);border:2px solid var(--pri);box-shadow:none}
.top{display:flex;justify-content:space-between;align-items:center;font-size:17px;font-weight:700;margin-bottom:8px}
.bar{height:14px;background:var(--line);border-radius:99px;overflow:hidden;margin-bottom:14px}
.bar i{display:block;height:100%;background:var(--pri);border-radius:99px;transition:width .3s}
.lv{color:#fff;border-radius:999px;padding:2px 12px;font-size:16px}
.q{font-size:23px;font-weight:700;line-height:1.4;margin:6px 0 16px}
.ic{font-size:76px;text-align:center;background:var(--soft);border-radius:20px;padding:10px 0;margin-bottom:12px}
.opt{display:flex;gap:10px;align-items:center;width:100%;min-height:58px;text-align:left;background:var(--card);color:var(--tx);border:2px solid var(--line);border-radius:16px;padding:10px 14px;margin:10px 0;font-size:20px}
.opt span.k{flex:none;width:34px;height:34px;border-radius:50%;background:var(--bg);display:grid;place-items:center;font-weight:800;font-size:17px}
.opt.ok{background:var(--okbg);border-color:var(--ok)}
.opt.no{background:var(--nobg);border-color:var(--no)}
.opt:disabled{cursor:default;opacity:1;color:var(--tx)}
.fb{border-radius:16px;padding:12px 14px;margin-top:12px;font-size:19px}
.fb.ok{background:var(--okbg)}.fb.no{background:var(--nobg)}
.score{font-size:64px;font-weight:800;color:var(--pri)}
.stars{font-size:48px}
.rv{text-align:left;font-size:18px;border-top:2px dashed var(--line);padding-top:10px;margin-top:10px}
.hide{display:none}
</style>
</head>
<body>
<div class="app" id="app"></div>
<script>
var D=[
["Mudah","🧊","Es batu diletakkan di bawah sinar matahari lalu berubah menjadi air. Peristiwa ini disebut …",["mencair","membeku","menguap","mengembun"],0,"Mencair adalah perubahan wujud dari padat menjadi cair."],
["Mudah","❄️","Air di dalam freezer berubah menjadi es batu. Peristiwa ini disebut …",["menguap","membeku","menyublim","mencair"],1,"Membeku adalah perubahan wujud dari cair menjadi padat."],
["Mudah","✂️","Selembar kertas digunting menjadi potongan kecil. Perubahan ini termasuk perubahan …",["kimia, karena bentuknya berubah","fisika, karena tidak terbentuk zat baru","kimia, karena ukurannya mengecil","fisika, karena kertas menjadi abu"],1,"Kertas tetap kertas. Hanya bentuk dan ukurannya yang berubah, sehingga ini perubahan fisika."],
["Mudah","🔥","Kayu dibakar sehingga menjadi arang dan abu. Perubahan ini termasuk perubahan …",["fisika","kimia","wujud","bentuk"],1,"Arang dan abu adalah zat baru yang berbeda dari kayu. Jadi, ini perubahan kimia."],
["Mudah","🍵","Gula diaduk ke dalam teh hangat hingga larut. Perubahan ini termasuk perubahan …",["kimia, karena rasa teh menjadi manis","kimia, karena gula hilang","fisika, karena gula tetap ada dan tidak terbentuk zat baru","fisika, karena teh menjadi dingin"],2,"Gula hanya bercampur dengan air. Gula masih ada di dalam teh, sehingga ini perubahan fisika."],
["Mudah","🥛","Susu yang dibiarkan lama di udara terbuka menjadi basi dan berbau asam. Perubahan ini adalah …",["perubahan fisika","perubahan kimia","perubahan wujud","pemuaian"],1,"Bau asam menandakan terbentuknya zat baru, sehingga susu basi termasuk perubahan kimia."],
["Mudah","🥤","Bagian luar gelas berisi es teh tampak berembun. Titik-titik air itu berasal dari uap air yang …",["menguap","menyublim","mengembun","membeku"],2,"Uap air di udara bersentuhan dengan gelas dingin lalu berubah menjadi cair. Peristiwa ini disebut mengembun."],
["Sedang","🫧","Tablet obat dimasukkan ke dalam air dan muncul banyak gelembung gas. Hal ini merupakan salah satu ciri perubahan …",["fisika, karena wujud berubah","kimia, karena terbentuk gas","fisika, karena ada air","kimia, karena tablet menjadi besar"],1,"Munculnya gas baru merupakan salah satu ciri perubahan kimia."],
["Sedang","🔩","Paku besi dibiarkan di tempat lembap sehingga berkarat. Apa yang terjadi pada paku itu?",["Perubahan fisika, karena bentuk paku tetap","Perubahan kimia, karena terbentuk zat baru berupa karat","Perubahan fisika, karena paku mencair","Perubahan kimia, karena paku membeku"],1,"Karat adalah zat baru yang berbeda dari besi. Jadi, perkaratan termasuk perubahan kimia."],
["Sedang","🧿","Kapur barus di dalam lemari lama-kelamaan mengecil lalu habis tanpa terlihat mencair. Perubahan wujud ini disebut …",["mengembun","menyublim","mengkristal","menguap"],1,"Menyublim adalah perubahan wujud dari padat langsung menjadi gas."],
["Sedang","🍞","Singkong diolah menjadi tape dengan bantuan ragi (fermentasi). Perubahan ini termasuk …",["perubahan kimia, karena terbentuk zat baru dengan rasa dan bau berbeda","perubahan fisika, karena singkong masih berwarna putih","perubahan fisika, karena singkong dipotong","perubahan wujud, karena singkong mencair"],0,"Tape memiliki rasa, bau, dan zat yang berbeda dari singkong. Jadi, fermentasi adalah perubahan kimia."],
["Sedang","🌡️","Manakah pasangan perubahan wujud yang BENAR?",["Menguap: gas menjadi cair","Menyublim: padat menjadi gas","Mengembun: cair menjadi gas","Membeku: gas menjadi padat"],1,"Menguap: cair → gas. Mengembun: gas → cair. Membeku: cair → padat. Menyublim: padat → gas."],
["Sedang","🍳","Telur mentah direbus hingga matang, lalu tidak dapat kembali menjadi telur mentah. Hal ini menunjukkan bahwa …",["terjadi perubahan fisika","terjadi perubahan kimia","terjadi pemuaian","terjadi pelarutan"],1,"Perubahan yang sulit kembali ke zat semula dan menghasilkan zat baru adalah ciri perubahan kimia."],
["Sedang","⚖️","Apa perbedaan utama perubahan fisika dan perubahan kimia?",["Perubahan fisika menghasilkan zat baru, perubahan kimia tidak","Perubahan fisika tidak menghasilkan zat baru, perubahan kimia menghasilkan zat baru","Perubahan fisika selalu butuh api","Perubahan kimia hanya terjadi pada benda cair"],1,"Kunci pembeda: ada atau tidaknya zat baru yang terbentuk."],
["Sulit","🕯️","Lilin yang menyala tampak meleleh, sedangkan sumbunya terbakar. Peristiwa ini menunjukkan …",["hanya perubahan fisika","hanya perubahan kimia","perubahan fisika dan perubahan kimia","tidak ada perubahan"],2,"Lilin meleleh adalah perubahan fisika (padat menjadi cair). Sumbu dan lilin yang terbakar adalah perubahan kimia."],
["Sulit","🧂","Air garam dipanaskan sampai airnya habis dan tersisa garam. Mengapa peristiwa ini termasuk perubahan fisika?",["Karena terbentuk zat baru","Karena airnya berubah menjadi garam","Karena garam masih ada dan tidak terbentuk zat baru","Karena suhunya naik"],2,"Air hanya menguap, sedangkan garam tetap ada. Tidak ada zat baru, sehingga ini perubahan fisika."],
["Sulit","🧪","Cuka dicampur dengan soda kue sehingga muncul gelembung gas. Kesimpulan yang paling tepat adalah …",["terjadi perubahan fisika karena ada gelembung","terjadi perubahan kimia karena terbentuk gas baru","tidak terjadi perubahan apa pun","terjadi pelarutan biasa"],1,"Gas baru yang terbentuk menandakan telah terjadi reaksi kimia."],
["Sulit","📋","Kelompok manakah yang SEMUANYA termasuk perubahan kimia?",["Es mencair, air menguap, gula larut","Besi berkarat, kayu membusuk, nasi menjadi basi","Kertas disobek, kaca pecah, air membeku","Kapur barus menyublim, es mencair, besi berkarat"],1,"Berkarat, membusuk, dan basi menghasilkan zat baru. Pilihan lain mengandung perubahan fisika."],
["Sulit","♨️","Kelompok perubahan wujud manakah yang SEMUANYA menyerap kalor (panas)?",["Mencair, menguap, menyublim","Membeku, mengembun, menyublim","Mengembun, membeku, mencair","Menguap, membeku, mengembun"],0,"Mencair, menguap, dan menyublim memerlukan kalor. Membeku dan mengembun melepaskan kalor."],
["Sulit","🚿","Setelah mandi air hangat, cermin kamar mandi menjadi berembun. Perubahan wujud yang terjadi dan kalornya adalah …",["menguap dan menyerap kalor","mencair dan menyerap kalor","mengembun dan melepas kalor","membeku dan melepas kalor"],2,"Uap air (gas) berubah menjadi air (cair) saat mengembun, dan peristiwa ini melepaskan kalor."]
];
var COL={Mudah:"var(--easy)",Sedang:"var(--mid)",Sulit:"var(--hard)"};
var app=document.getElementById("app"),i=0,score=0,wrong=[],nama="",kelas="",Q=[];
function sh(a){a=a.slice();for(var j=a.length-1;j>0;j--){var k=Math.floor(Math.random()*(j+1)),t=a[j];a[j]=a[k];a[k]=t}return a}
function start(){
 app.innerHTML='<div class="card center"><div class="big">🧪🔬</div><h1>Kuis IPA<br>Perubahan Fisika dan Kimia</h1><p class="sub">Kelas VII</p>'+
 '<div class="info"><b>SMPN Satu Atap 2 Palangka Raya</b>Mata pelajaran: IPA<br>Guru: Wiwi Selvia, S.Pd.</div>'+
 '<div class="chips"><span class="chip" style="background:var(--easy)">7 Mudah</span><span class="chip" style="background:var(--mid)">7 Sedang</span><span class="chip" style="background:var(--hard)">6 Sulit</span></div>'+
 '<p class="sub">Total '+D.length+' soal. Pilih satu jawaban yang paling tepat.</p>'+
 '<input id="nm" placeholder="Nama lengkap" maxlength="40" autocomplete="off"><input id="kl" placeholder="Kelas (contoh: VII A)" maxlength="12" autocomplete="off"><div id="er" style="color:var(--no);font-weight:700;font-size:17px"></div>'+
 '<button class="btn" id="go">Mulai Kuis ▶</button></div>';
 document.getElementById("go").onclick=function(){nama=document.getElementById("nm").value.trim();kelas=document.getElementById("kl").value.trim();if(!nama||!kelas){document.getElementById("er").textContent="Isi nama dan kelas dulu, ya.";return}i=0;score=0;wrong=[];show()};
}
function show(){
 var d=D[i],pil=sh(d[3].map(function(t,n){return{t:t,c:n===d[4]}})),L="ABCD";
 var h='<div class="card"><div class="top"><span>Soal '+(i+1)+' / '+D.length+'</span><span class="lv" style="background:'+COL[d[0]]+'">'+d[0]+'</span><span>⭐ '+score*5+'</span></div>'+
 '<div class="bar"><i style="width:'+(i/D.length*100)+'%"></i></div><div class="ic">'+d[1]+'</div><div class="q">'+d[2]+'</div><div id="ops">';
 pil.forEach(function(p,n){h+='<button class="opt" data-n="'+n+'"><span class="k">'+L[n]+'</span><span>'+p.t+'</span></button>'});
 h+='</div><div id="fb"></div></div>';
 app.innerHTML=h;window.scrollTo(0,0);
 var bs=app.querySelectorAll(".opt");
 bs.forEach(function(b){b.onclick=function(){
  var n=+b.dataset.n,ok=pil[n].c;
  bs.forEach(function(x,m){x.disabled=true;if(pil[m].c)x.classList.add("ok")});
  if(!ok)b.classList.add("no");
  if(ok)score++;else wrong.push({q:d[2],a:pil.filter(function(p){return p.c})[0].t,e:d[5]});
  var last=i===D.length-1;
  document.getElementById("fb").innerHTML='<div class="fb '+(ok?"ok":"no")+'"><b>'+(ok?"✅ Benar! Hebat!":"❌ Belum tepat.")+'</b><br>'+d[5]+'</div><button class="btn" id="nx">'+(last?"Lihat Hasil 🏆":"Lanjut ➡️")+'</button>';
  document.getElementById("nx").onclick=function(){i++;last?hasil():show()};
  document.getElementById("nx").scrollIntoView({behavior:"smooth",block:"center"});
 }});
}
function hasil(){
 var nil=score*5,st=nil>=90?3:nil>=70?2:nil>=50?1:0,pesan=nil>=90?"Luar biasa! Kamu sangat paham materi ini.":nil>=70?"Bagus! Sedikit lagi kamu akan sempurna.":nil>=50?"Cukup baik. Ayo pelajari lagi bagian yang salah.":"Jangan menyerah! Baca materinya lagi lalu coba kembali.";
 var h='<div class="card center"><div class="big">'+(st>=2?"🎉":"💪")+'</div><h1>Kuis Selesai!</h1><div class="info" style="text-align:center"><b>'+nama+'</b>Kelas '+kelas+'<br>'+new Date().toLocaleDateString("id-ID",{day:"numeric",month:"long",year:"numeric"})+'</div><div class="stars">'+"⭐".repeat(st)+"☆".repeat(3-st)+'</div>'+
 '<div class="score">'+nil+'</div><p class="sub">Benar '+score+' dari '+D.length+' soal</p><p>'+pesan+'</p>';
 if(wrong.length){h+='<h2 style="margin-top:18px">📝 Yang perlu dipelajari</h2>';wrong.forEach(function(w){h+='<div class="rv"><b>'+w.q+'</b><br>Jawaban benar: <b style="color:var(--ok)">'+w.a+'</b><br>'+w.e+'</div>'})}
 h+='<button class="btn" id="re">🔄 Main Lagi</button><div class="info" style="text-align:center;margin-top:20px">SMPN Satu Atap 2 Palangka Raya<br>IPA · Guru: Wiwi Selvia, S.Pd.</div></div>';
 app.innerHTML=h;window.scrollTo(0,0);
 document.getElementById("re").onclick=start;
}
start();
</script>
</body>
</html>
